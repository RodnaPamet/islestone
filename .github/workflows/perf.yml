name: Performance (nightly)

# Hardening H2b (docs/porting/maps/H2.md part 1.7; docs/performance.md,
# "Latency" and "The nightly run"; owner decisions 166 to 168).
#
# Nightly: the 100k seed (scripts/seed-scale/, the dump cached), the plan
# checks and statements per request at 100k (their 100k buffer budgets), and
# the latency harness (scripts/perf/run.mjs) against the built app with the
# budgets ENFORCED: 25 % tolerance and one automatic re-run of a failing
# scenario. The 10k shape is measured first in the same job, so the ratio
# rules (the detail no slower at 100k than 1.2x its 10k p95, a first page no
# slower than 1.5x) compare like with like. Browser timings are reported only.
# A red night opens, or comments on, one issue ("Nightly performance run is
# red"), so a regression that slips past the pull request's 10k checks is
# seen the next morning (inflect-compliance's integration-stress.yml: a suite
# that turned red only after merging went unnoticed for 32 hours; pattern
# only).
#
# workflow_dispatch runs either shape (budgets enforced only at 100k); a push
# to main runs 10k for the job summary and the artifact, reported only.
#
# Hardening H2g (docs/porting/maps/H2.md part 7; owner decision 180): the
# nightly E2E isolation run, a job of its own on the schedule and on dispatch
# (never on a push). The whole Playwright suite with every test repeated
# twice, no retries and four workers, then each spec file alone, so an order
# dependence a pull request's one retry turns into a pass shows here. A red
# night opens, or comments on, one issue ("Nightly E2E isolation run is red").
#
# Hardening H2f (docs/porting/maps/H2.md part 6; docs/intake.md, "Fuzzing";
# owner decision 178): the nightly also re-runs the intake fuzz properties
# (tests/unit/intake/fuzz/) at 20,000 cases each, where a pull request runs
# 100. A failure prints its seed and path (FC_SEED, FC_PATH) to replay it,
# and opens or comments on the same issue as a red performance night.
# Every action is pinned by commit (tests/guards/workflow-action-pinning.test.ts).

on:
  schedule:
    # Off the hour, away from DAST's 03:17 (dast.yml).
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      scale:
        description: Seed shape to measure
        type: choice
        options: ['100k', '10k']
        default: '100k'
  push:
    branches: [main]

permissions: {}

concurrency:
  group: perf-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  perf:
    name: Performance (${{ github.event_name == 'push' && '10k' || inputs.scale || '100k' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    services:
      redis:
        image: redis:7.4.12-alpine3.22
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SCALE: ${{ github.event_name == 'push' && '10k' || inputs.scale || '100k' }}
      # Budgets block the nightly and a dispatched 100k run; a push only reports.
      ENFORCE: ${{ github.event_name != 'push' && (inputs.scale || '100k') == '100k' && '--enforce' || '' }}
      DATABASE_URL: postgresql://islestone:islestone_ci@127.0.0.1:6432/islestone_perf
      DIRECT_DATABASE_URL: postgresql://islestone:islestone_ci@127.0.0.1:5432/islestone_perf
      AUTH_SECRET: ci-perf-throwaway-secret-not-for-production # pragma: allowlist secret
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      LOG_LEVEL: warn
      # The same throwaway key as ci.yml's Performance (10k) job, so the 10k
      # dump is shared; `k1` in the cache keys names it. Never a real key.
      DATA_ENCRYPTION_KEY: ci-perf-data-encryption-key-not-a-real-secret-k1 # pragma: allowlist secret
      REDIS_URL: redis://:islestone_ci@127.0.0.1:6379
      SEED_HASH: ${{ hashFiles('prisma/migrations/**', 'scripts/seed-scale/**', 'deploy/postgres/**') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the app
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: '1'
      - name: Configure Redis (noeviction, password)
        run: |
          docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET maxmemory-policy noeviction
          docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET requirepass islestone_ci
      - name: Build and start Postgres (pg_stat_statements) and PgBouncer (scripts/ci-postgres.sh)
        run: scripts/ci-postgres.sh islestone_perf --pgbouncer --pg-stat-statements
      - name: Install Chromium for the browser timings
        if: env.SCALE == '100k' || github.event_name != 'push'
        run: npx playwright install --with-deps chromium

      # ── The 10k baseline (for the ratio rules), at 100k only ─────────────
      - name: Restore the cached 10k seed
        id: seed-10k
        if: env.SCALE == '100k'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .perf-cache/seed-10k.dump
          key: perf-seed-10k-k1-${{ env.SEED_HASH }}
      - name: Seed, or restore, and verify the 10k shape
        if: env.SCALE == '100k'
        run: scripts/perf/nightly-seed.sh 10k "${{ steps.seed-10k.outputs.cache-hit }}"
      - name: Save the 10k dump
        if: env.SCALE == '100k' && steps.seed-10k.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .perf-cache/seed-10k.dump
          key: perf-seed-10k-k1-${{ env.SEED_HASH }}
      - name: Latency at 10k (the baseline; reported)
        if: env.SCALE == '100k'
        run: |
          scripts/perf/serve.sh start
          node scripts/perf/run.mjs --shape 10k --out perf-report/10k
          scripts/perf/serve.sh stop
      - name: Empty the database for the 100k shape
        if: env.SCALE == '100k'
        run: scripts/perf/nightly-seed.sh reset

      # ── The measured shape ───────────────────────────────────────────────
      - name: Restore the cached seed
        id: seed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .perf-cache/seed-${{ env.SCALE }}.dump
          key: perf-seed-${{ env.SCALE }}-k1-${{ env.SEED_HASH }}
      - name: Seed, or restore, and verify the shape
        run: scripts/perf/nightly-seed.sh "$SCALE" "${{ steps.seed.outputs.cache-hit }}"
      - name: Save the dump
        if: steps.seed.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .perf-cache/seed-${{ env.SCALE }}.dump
          key: perf-seed-${{ env.SCALE }}-k1-${{ env.SEED_HASH }}
      - name: Plan checks and statements per request (blocking)
        run: npm run test:perf -- --ci
        env:
          PERF_SHAPE: ${{ env.SCALE }}
          PERF_REPORT_DIR: perf-report/${{ env.SCALE }}
      - name: Start the built app (scripts/perf/serve.sh)
        run: scripts/perf/serve.sh start
      - name: Latency harness
        run: |
          compare=""
          if [ "$SCALE" = 100k ]; then compare="--compare perf-report/10k/perf-summary.json"; fi
          browser=""
          if [ "$SCALE" = 100k ] || [ "${{ github.event_name }}" != push ]; then browser="--browser"; fi
          node scripts/perf/run.mjs --shape "$SCALE" --out "perf-report/$SCALE" $ENFORCE $compare $browser
      - name: Stop the app
        if: always()
        run: scripts/perf/serve.sh stop
      - name: Upload the performance summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-summary-${{ env.SCALE }}
          path: perf-report
          if-no-files-found: ignore
          retention-days: 90

  e2e-isolation:
    name: E2E isolation (repeat-each 2, no retries)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    # As ci.yml's E2E job: the built app, Islestone's Postgres image through
    # PgBouncer, an authenticated Redis; throwaway values.
    services:
      redis:
        image: redis:7.4.12-alpine3.22
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://islestone:islestone_ci@127.0.0.1:6432/islestone_e2e
      DIRECT_DATABASE_URL: postgresql://islestone:islestone_ci@127.0.0.1:5432/islestone_e2e
      REDIS_URL: redis://:islestone_ci@127.0.0.1:6379
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the app
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: '1'
      - name: Configure Redis (noeviction, password)
        run: |
          docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET maxmemory-policy noeviction
          docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET requirepass islestone_ci
      - name: Build and start Postgres and PgBouncer (scripts/ci-postgres.sh)
        run: scripts/ci-postgres.sh islestone_e2e --pgbouncer
      - run: npm run migrate:deploy
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # Every test twice, in a different order and beside different
      # neighbours, with no retry to hide a failure.
      - name: Every test twice, no retries, four workers
        id: repeat
        run: npx playwright test --repeat-each=2 --retries=0 --workers=4
      # Each spec file in a run of its own: a spec that passes only after
      # another file's tests have run fails here. Every file runs; the step
      # fails at the end, naming each one that failed alone.
      - name: Each spec file alone
        if: ${{ !cancelled() && steps.repeat.outcome != 'skipped' }}
        run: |
          failed=""
          for spec in $(git ls-files 'tests/e2e/*.spec.ts'); do
            echo "::group::$spec"
            npx playwright test "$spec" --retries=0 --reporter=list || failed="$failed $spec"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Spec files that fail when run alone:$failed"
            exit 1
          fi
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-isolation
          path: playwright-report
          retention-days: 14

  # The intake fuzz properties at 20,000 cases each (H2f, decision 178), in
  # band so their per-input time bounds measure one property at a time.
  intake-fuzz:
    name: Intake fuzzing (20,000 cases)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fuzz the intake parsers and schemas (a failure prints FC_SEED and FC_PATH)
        run: npx jest --selectProjects node --testPathPatterns tests/unit/intake/fuzz --ci --runInBand
        env:
          FC_NUM_RUNS: '20000'

  # A red night opens one issue, or comments on the open one. This job runs
  # no repository code and is the only one with a write scope.
  report:
    name: Report a red night
    needs: [perf, intake-fuzz]
    if: always() && (needs.perf.result == 'failure' || needs.intake-fuzz.result == 'failure') && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    steps:
      - name: Download the summary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: perf-summary-100k
          path: perf-report
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PERF_RESULT: ${{ needs.perf.result }}
          FUZZ_RESULT: ${{ needs.intake-fuzz.result }}
        run: |
          title='Nightly performance run is red'
          {
            echo "The nightly run failed on $(date -u +%Y-%m-%d): $RUN_URL"
            echo
            if [ "$FUZZ_RESULT" = failure ]; then
              echo 'The intake fuzzing job failed (20,000 cases per property, decision 178): its log names each failing property with its FC_SEED and FC_PATH. Replay it with `FC_SEED=<seed> FC_PATH=<path> npx jest <file>`, then fix it with an example test pinned to the seed (docs/intake.md, "Fuzzing").'
              echo
            fi
            if [ "$PERF_RESULT" = failure ]; then
              echo 'The performance run at 100k failed. Budgets: scripts/perf/budgets.json (decision 167); the rules: docs/performance.md, "Latency" (decision 168: 25 % tolerance, one re-run).'
              echo
              if [ -f perf-report/100k/perf-summary.md ]; then cat perf-report/100k/perf-summary.md; else echo 'No latency summary was written: the run failed before the harness (seed, plan checks or statements); see the run.'; fi
            fi
          } > body.md
          number="$(gh api "repos/$REPO/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$number" ]; then
            gh api "repos/$REPO/issues/$number/comments" -F body=@body.md >/dev/null
            echo "Commented on #$number"
          else
            gh api "repos/$REPO/issues" -f title="$title" -F body=@body.md >/dev/null
            echo 'Opened an issue'
          fi

  # A red isolation night opens one issue, or comments on the open one, as
  # the performance run's does. No repository code; the only write scope.
  report-e2e-isolation:
    name: Report a red isolation night
    needs: e2e-isolation
    if: always() && needs.e2e-isolation.result == 'failure' && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Nightly E2E isolation run is red'
          {
            echo "The nightly E2E isolation run failed on $(date -u +%Y-%m-%d): $RUN_URL"
            echo
            echo 'It runs every test twice with no retries on four workers, then each spec file alone (docs/porting/maps/H2.md part 7, decision 180). A spec that fails here and passes on a pull request depends on the order or on another spec: fix its isolation (tests/e2e/README.md, "Isolation").'
          } > body.md
          number="$(gh api "repos/$REPO/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$number" ]; then
            gh api "repos/$REPO/issues/$number/comments" -F body=@body.md >/dev/null
            echo "Commented on #$number"
          else
            gh api "repos/$REPO/issues" -f title="$title" -F body=@body.md >/dev/null
            echo 'Opened an issue'
          fi
