name: CI

on:
  pull_request:
  push:
    branches: [main]

# No token permissions by default. Each job states the read-only scope it
# needs, so widening one job is a change to that job, never an inherited one.
# The jobs that run `npm ci` execute dependencies' install scripts, which is
# why none of them may inherit a wider default.
permissions: {}

# A new push to a pull request cancels that PR's run in flight. Runs on main
# are never cancelled, so every commit there gets a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Reads the lockfile only; installs nothing. Fails on a moderate or
      # worse advisory in a production dependency.
      - run: npm audit --omit=dev --audit-level=moderate

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # No SKIP_ENV_VALIDATION here: `npm run typecheck` sets it for `next
    # typegen` itself (scripts/next-typegen.mjs), so this job proves a fresh
    # clone with no environment can type-check.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -- --ci
      # The plain-ESM script tests (tests/unit/**/*.test.mjs) run under node --test,
      # which Jest's projects do not match.
      - run: npm run test:scripts

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # The DB-backed suites (tests/integration) against a real Postgres, the
    # image docker-compose.yml builds (deploy/postgres/Dockerfile, sub-phase
    # 2.7f: built here from this pull request, so the Dockerfile is tested
    # before it is published), reached through PgBouncer in transaction mode
    # as the app reaches it (scripts/ci-postgres.sh). Credentials are
    # throwaway CI values.
    services:
      # Sub-phase 1.6: the queue round trip (tests/integration/jobs-queue-roundtrip.test.ts)
      # runs against a real Redis, configured as docker-compose.yml's
      # (noeviction, a password).
      redis:
        image: redis:7.4.12-alpine3.22
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Migrations and the drift check go to Postgres directly; the suites go
      # through PgBouncer (tests/helpers/db.ts).
      DATABASE_URL: postgresql://islestone:islestone_ci@127.0.0.1:5432/islestone_test
      DIRECT_DATABASE_URL: postgresql://islestone:islestone_ci@127.0.0.1:5432/islestone_test
      DATABASE_URL_TEST: postgresql://islestone:islestone_ci@127.0.0.1:6432/islestone_test
      DIRECT_DATABASE_URL_TEST: postgresql://islestone:islestone_ci@127.0.0.1:5432/islestone_test
      REDIS_URL: redis://:islestone_ci@127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # `postinstall` runs `prisma generate`.
      - run: npm ci
      # Islestone's Postgres image, built from this pull request, with
      # prisma/init-roles.sh run on its fresh volume (app_user, and the login
      # role a member of it), and PgBouncer in front of it.
      - name: Build and start Postgres and PgBouncer (scripts/ci-postgres.sh)
        run: scripts/ci-postgres.sh islestone_test --pgbouncer
      # A service container takes no command line, so docker-compose.yml's
      # flags are set at run time: the policy BullMQ needs, then the
      # password REDIS_URL names (a throwaway CI value).
      - name: Configure Redis (noeviction, password)
        run: |
          docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET maxmemory-policy noeviction
          docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET requirepass islestone_ci
      - run: npm run migrate:deploy
      # A database built only from prisma/migrations must reproduce
      # prisma/schema, both ways (scripts/check-fresh-db-schema-drift.mjs).
      - run: npm run db:check-schema-drift
      - run: npm run test:integration -- --ci

  # Hardening H2a (owner decisions 166, 168, 170 to 172; docs/performance.md):
  # the deterministic performance checks on the 10k seed, blocking. The seed
  # (scripts/seed-scale/) is cached as a dump keyed on everything it is built
  # from; a miss seeds it (about two minutes) and saves the dump, a hit
  # restores it. Either way it is verified before anything is measured. Then
  # the plan checks (tests/perf/plans.test.ts) and the statements per request
  # (tests/perf/statements.test.ts, pg_stat_statements). Then (H2b) the
  # latency harness against the built app (scripts/perf/run.mjs): reported,
  # not blocking on latency (decision 168), but a scenario that measured
  # nothing fails the job. The budgets block only the nightly 100k run
  # (.github/workflows/perf.yml).
  performance:
    name: Performance (10k)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      # The built app refuses to start without an authenticated Redis (1.6).
      redis:
        image: redis:7.4.12-alpine3.22
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The usecases go through PgBouncer as production does; the bulk writer,
      # the verification and the plan checks connect directly.
      DATABASE_URL: postgresql://islestone:islestone_ci@127.0.0.1:6432/islestone_perf
      DIRECT_DATABASE_URL: postgresql://islestone:islestone_ci@127.0.0.1:5432/islestone_perf
      # The app's env module validates these; throwaway values (the seeder
      # signs nobody in).
      AUTH_SECRET: ci-perf-throwaway-secret-not-for-production # pragma: allowlist secret
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      LOG_LEVEL: warn
      PERF_SHAPE: 10k
      PERF_REPORT_DIR: perf-report
      # The seed wraps each workspace's data key and hashes its emails under
      # this key, and the harness's server reads them with it, so it is one
      # throwaway value, the same in perf.yml; the dump's cache key carries
      # `k1` for it (change both together). Never a real key.
      DATA_ENCRYPTION_KEY: ci-perf-data-encryption-key-not-a-real-secret-k1 # pragma: allowlist secret
      REDIS_URL: redis://:islestone_ci@127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build and start Postgres (pg_stat_statements) and PgBouncer (scripts/ci-postgres.sh)
        run: scripts/ci-postgres.sh islestone_perf --pgbouncer --pg-stat-statements
      - name: Restore the cached 10k seed
        id: seed-cache
        uses: actions/cache/restore@v6
        with:
          path: .perf-cache/seed-10k.dump
          key: perf-seed-10k-k1-${{ hashFiles('prisma/migrations/**', 'scripts/seed-scale/**', 'deploy/postgres/**') }}
      - name: Restore the dump
        if: steps.seed-cache.outputs.cache-hit == 'true'
        run: scripts/seed-scale/cache.sh restore islestone_perf .perf-cache/seed-10k.dump
      - name: Seed the 10k shape and dump it
        if: steps.seed-cache.outputs.cache-hit != 'true'
        run: |
          npm run migrate:deploy
          npm run seed:scale -- --shape 10k
          scripts/seed-scale/cache.sh save islestone_perf .perf-cache/seed-10k.dump
      - name: Save the dump
        if: steps.seed-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .perf-cache/seed-10k.dump
          key: ${{ steps.seed-cache.outputs.cache-primary-key }}
      # A fresh seed verified itself above; a restored one is verified here.
      - name: Verify the restored seed
        if: steps.seed-cache.outputs.cache-hit == 'true'
        run: npm run seed:scale -- --shape 10k --verify-only
      - name: Install pg_stat_statements in the seeded database
        run: docker exec islestone-ci-postgres psql -q -U islestone -d islestone_perf -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'
      - name: Plan checks and statements per request (blocking)
        run: npm run test:perf -- --ci
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next
      - name: Configure Redis (noeviction, password)
        run: |
          docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET maxmemory-policy noeviction
          docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET requirepass islestone_ci
      - name: Start the built app (scripts/perf/serve.sh)
        run: scripts/perf/serve.sh start
      # Latency at 10k, reported (decision 168); a run that measured nothing fails.
      - name: Latency harness (reported; a run that measured nothing fails)
        run: node scripts/perf/run.mjs --shape 10k
      - name: Stop the app
        if: always()
        run: scripts/perf/serve.sh stop
      - name: Upload the performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-report-10k
          path: perf-report
          if-no-files-found: ignore
          retention-days: 30

  licence:
    name: Licence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # The gate reads the lockfile and cross-checks each production package's
      # installed package.json. It reads manifests and never runs package code,
      # so install scripts are skipped.
      - run: npm ci --ignore-scripts
      # Production dependency licences against the allowlist, and no import
      # from an open-core `ee` folder or a deny-listed package
      # (scripts/licence-gate.mjs, roadmap 0.3 and H0).
      - run: npm run licence:check

  shared-ui:
    name: Shared UI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Straight after checkout, before any install or build: the filesystem is
      # exactly the committed tree, so every file in packages/ui must match
      # UPSTREAM.json and nothing may be added to it (docs/porting/shared-ui.md).
      - run: node scripts/ui-drift.mjs verify --population fs
      # The same for the generic UI files copied into src/ (ui-mirror.json):
      # every mirrored file matches its hash, and nothing unlisted sits under
      # src/components/ui or src/lib/hooks.
      - run: node scripts/ui-mirror.mjs verify --population fs
      # Bind the manifest to upstream: inflect-compliance is public, so the
      # pinned commit is fetched with no secret and the manifest must list
      # exactly its packages/ui files, hashes and modes.
      - name: Audit against inflect-compliance at the pinned commit
        run: |
          commit="$(node -p "require('./packages/ui/UPSTREAM.json').commit")"
          git init -q "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" fetch -q --depth 1 --no-tags \
            https://github.com/RodnaPamet/inflect-compliance "$commit"
          node scripts/ui-drift.mjs audit "$RUNNER_TEMP/upstream"
      - name: Audit ui-mirror.json against inflect-compliance at its commit
        run: |
          commit="$(node -p "require('./ui-mirror.json').commit")"
          git init -q "$RUNNER_TEMP/upstream-src"
          git -C "$RUNNER_TEMP/upstream-src" fetch -q --depth 1 --no-tags \
            https://github.com/RodnaPamet/inflect-compliance "$commit"
          node scripts/ui-mirror.mjs audit "$RUNNER_TEMP/upstream-src"

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SKIP_ENV_VALIDATION: '1'
      # Inlined into the client bundle; matches the e2e server's origin.
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # The worker, scheduler and healthcheck bundles (scripts/build-worker.mjs,
      # sub-phase 1.6), into dist/; not uploaded.
      - run: npm run build:worker
      - name: Upload the build for e2e
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          # `.next` is a hidden directory; the cache inside it is not needed to start.
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  # Sub-phase 1.8: both container images, built on every pull request so the
  # Dockerfile cannot rot, and never pushed (publishing is release.yml's, on
  # main only). Each image is then started far enough to prove it is what the
  # compose file expects, and scanned by Trivy.
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      # The Trivy SARIF upload to the Security tab.
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the app image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: app
          push: false
          load: true
          tags: islestone:ci-${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=islestone-image
          cache-to: type=gha,scope=islestone-image,mode=max,ignore-error=true
      - name: Build the worker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: worker
          push: false
          load: true
          tags: islestone-worker:ci-${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=islestone-image
          cache-to: type=gha,scope=islestone-image,mode=max,ignore-error=true
      # What the compose file and the runbook rely on, read out of the built
      # images: a non-root user, the standalone server and the migration head
      # in the app, the bundles and a runnable Prisma CLI in the worker, no npm
      # in either, and the build's commit baked in.
      - name: Inspect the images
        env:
          APP: islestone:ci-${{ github.sha }}
          WORKER: islestone-worker:ci-${{ github.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for image in "$APP" "$WORKER"; do
            test "$(docker run --rm --entrypoint id "$image" -u)" = "1000"
            test "$(docker run --rm --entrypoint printenv "$image" BUILD_SHA)" = "$SHA"
            docker run --rm --entrypoint sh "$image" -c '! command -v npm && test -s .migration-head && test -s NOTICE && test -s LICENSE'
          done
          docker run --rm --entrypoint sh "$APP" -c 'test -f server.js && test -d .next/static && test ! -d node_modules/prisma'
          docker run --rm --entrypoint sh "$WORKER" -c 'test -f dist/worker.mjs && test -f dist/scheduler.mjs && test -f dist/worker-healthcheck.mjs'
          docker run --rm --entrypoint node_modules/.bin/prisma "$WORKER" --version
      # Blocking since Hardening H1 (2026-11-26; owner decision 47 set the
      # report-only window before it): a CRITICAL or HIGH vulnerability with a
      # fix available fails the job, as it fails the publish in release.yml.
      # The SARIF is limited to those severities, or trivy-action drops the
      # filter for SARIF and the gate would be every severity. An unfixable
      # finding may be excused only in `.trivyignore`, with an expiry and a
      # reason (tests/guards/security-scan-deferral.test.ts).
      - name: Trivy scan of the app image (CRITICAL, HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: islestone:ci-${{ github.sha }}
          format: sarif
          output: trivy-app.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'
          timeout: 15m
      - name: Trivy scan of the worker image (CRITICAL, HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: islestone-worker:ci-${{ github.sha }}
          format: sarif
          output: trivy-worker.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'
          timeout: 15m
      # A pull request from a fork cannot write to the Security tab; the
      # upload is reporting, not the scan, so its failure fails nothing. It
      # runs after a failed scan too, so the finding reaches the Security tab.
      - name: Upload the app scan to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-app.sarif
          category: trivy-image-app
      - name: Upload the worker scan to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-worker.sarif
          category: trivy-image-worker

  e2e:
    name: E2E
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # The auth specs (sub-phase 1.4) register a workspace and sign in, so the
    # built app needs a migrated database, reached through PgBouncer as in
    # production: Islestone's Postgres image built from this pull request
    # (scripts/ci-postgres.sh, sub-phase 2.7f), as in the Integration job;
    # throwaway values.
    services:
      # Sub-phase 1.6: `next start` (production) refuses to run without an
      # authenticated REDIS_URL and checks the eviction policy at boot.
      redis:
        image: redis:7.4.12-alpine3.22
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://islestone:islestone_ci@127.0.0.1:6432/islestone_e2e
      DIRECT_DATABASE_URL: postgresql://islestone:islestone_ci@127.0.0.1:5432/islestone_e2e
      REDIS_URL: redis://:islestone_ci@127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next
      - name: Build and start Postgres and PgBouncer (scripts/ci-postgres.sh)
        run: scripts/ci-postgres.sh islestone_e2e --pgbouncer
      # A service container takes no command line, so docker-compose.yml's
      # flags are set at run time: the policy BullMQ needs, then the
      # password REDIS_URL names (a throwaway CI value).
      - name: Configure Redis (noeviction, password)
        run: |
          docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET maxmemory-policy noeviction
          docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET requirepass islestone_ci
      - run: npm run migrate:deploy
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
