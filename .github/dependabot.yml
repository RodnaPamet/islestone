version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # .npmrc sets save-exact; keep every version pinned.
    versioning-strategy: increase
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Islestone runs Node 24 (.nvmrc, CI, production). Type definitions for
      # a newer Node major describe APIs the runtime does not have, so
      # @types/node follows the runtime major and moves with .nvmrc.
      - dependency-name: '@types/node'
        versions: ['>=25']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
